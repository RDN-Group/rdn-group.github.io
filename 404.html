  <style>
    /* ========== Reset & Base ========== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #00C0FF;
      --primary-light: #2c5282;
      --accent: #0074C1;
      --text: #ffffff;
      --text-light: #ffffff;
      --bg: #003040;
      --bg-alt: #006D91;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --radius: 8px;
      --nav-height: 70px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      color: var(--text);
      line-height: 1.7;
      background: var(--bg);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img, svg {
      max-width: 100%;
      display: block;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    section {
      padding: 80px 0;
    }

    h1, h2, h3 {
      line-height: 1.3;
      font-weight: 700;
    }

    /* ========== Navbar ========== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: rgba(45, 45, 45, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      transition: box-shadow 0.3s ease;
    }

    .navbar.scrolled {
      box-shadow: var(--shadow);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--primary);
    }

    .logo svg {
      width: 150px;
      height: 150px;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      position: relative;
      transition: color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--primary);
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }

    /* ハンバーガーメニュー（モバイル） */
    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
    }

    .menu-toggle span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--primary);
      transition: 0.3s;
    }

    /* ========== Hero ========== */
    .hero {
      padding-top: calc(var(--nav-height) + 80px);
      padding-bottom: 100px;
      background: linear-gradient(135deg, #003c50 0%, #001c25 100%);
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      color: var(--primary);
      margin-bottom: 24px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero .lead {
      font-size: 1.15rem;
      color: var(--text-light);
      max-width: 600px;
      margin: 0 auto 40px;
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      border-radius: var(--radius);
      transition: background 0.25s, transform 0.2s;
    }

    .btn:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      margin-left: 12px;
    }

    .btn-outline:hover {
      background: var(--primary);
      color: #fff;
    }

    /* ========== Sections ========== */
    .section-title {
      text-align: center;
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .section-subtitle {
      text-align: center;
      color: var(--text-light);
      margin-bottom: 48px;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }

    /* About */
    .about-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
    }

    .about-text p {
      margin-bottom: 16px;
      color: var(--text);
    }

    .about-image {
      background: var(--bg-alt);
      border-radius: var(--radius);
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      font-size: 0.95rem;
      border: 1px dashed var(--border);
    }

    /* Members */
    .members {
      background: var(--bg-alt);
    }

    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 32px;
    }

    .member-card {
      background: #002041;
      border-radius: var(--radius);
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow);
      transition: transform 0.25s;
    }

    .member-card:hover {
      transform: translateY(-6px);
    }

    .member-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--bg-alt);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      font-size: 0.85rem;
      border: 3px solid var(--border);
    }

    .member-name {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .member-role {
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .member-desc {
      font-size: 0.9rem;
      color: var(--text-light);
    }

    /* Recruit */
    .recruit-content {
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }

    .recruit-list {
      list-style: none;
      text-align: left;
      margin: 32px 0;
    }

    .recruit-list li {
      padding: 16px 20px;
      background: var(--bg-alt);
      border-radius: var(--radius);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .recruit-list li::before {
      content: "✓";
      color: var(--accent);
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* Contact / CTA */
    .cta {
      background: var(--primary);
      color: #fff;
      text-align: center;
    }

    .cta .section-title {
      color: #fff;
    }

    .cta .section-subtitle {
      color: rgba(255, 255, 255, 0.8);
    }

    .cta .btn {
      background: var(--accent);
      color: #fff;
    }

    .cta .btn:hover {
      background: #dd6b20;
    }

    /* ========== Footer ========== */
    .footer {
      background: #141414;
      color: #a0aec0;
      padding: 48px 0 24px;
    }

    .footer-inner {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 40px;
      margin-bottom: 40px;
    }

    .footer-brand .logo {
      color: #fff;
      margin-bottom: 16px;
    }

    .footer-brand p {
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .footer h4 {
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .footer ul {
      list-style: none;
    }

    .footer ul li {
      margin-bottom: 10px;
    }

    .footer ul a:hover {
      color: #fff;
    }

    .footer-bottom {
      border-top: 1px solid #2d3748;
      padding-top: 24px;
      text-align: center;
      font-size: 0.85rem;
    }

    /* ========== Responsive ========== */
    @media (max-width: 768px) {
      .menu-toggle {
        display: flex;
      }

      .nav-links {
        position: fixed;
        top: var(--nav-height);
        left: 0;
        right: 0;
        background: #141414;
        flex-direction: column;
        padding: 24px;
        gap: 16px;
        border-bottom: 1px solid var(--border);
        transform: translateY(-120%);
        opacity: 0;
        transition: 0.3s ease;
        pointer-events: none;
      }

      .nav-links.open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      .about-content {
        grid-template-columns: 1fr;
      }

      .footer-inner {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .btn-outline {
        margin-left: 0;
        margin-top: 12px;
        display: block;
      }

      .hero .btn {
        display: block;
        width: 100%;
        max-width: 280px;
        margin: 0 auto 12px;
      }
    }
  </style>
</head>

  <script>
    // ナビバーのスクロール時シャドウ
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 20) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });

    // モバイルメニュー開閉
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');

    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('open');
    });

    // メニューリンククリックで閉じる
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('open');
      });
    });

    // スクロール位置に応じてアクティブなナビリンクをハイライト
    const sections = document.querySelectorAll('section[id]');
    const navItems = document.querySelectorAll('.nav-links a');

    window.addEventListener('scroll', () => {
      let current = '';
      sections.forEach(section => {
        const sectionTop = section.offsetTop - 100;
        if (window.scrollY >= sectionTop) {
          current = section.getAttribute('id');
        }
      });

      navItems.forEach(item => {
        item.classList.remove('active');
        if (item.getAttribute('href') === `#${current}`) {
          item.classList.add('active');
        }
      });
    });
  </script>
